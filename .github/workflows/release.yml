# release.yml — manual single-button release flow.
#
# WHAT IT DOES
#   1. Re-runs the full CI suite as a pre-flight gate (ci.yml via workflow_call).
#   2. Computes the next version from versions.mk + bump input.
#   3. Builds + signs the multi-arch image (ko + cosign + SBOM, mirrored to DH).
#   4. Cross-compiles the Go binaries (goreleaser) and emits SLSA3 provenance.
#   5. ONLY THEN bumps versions.mk, commits, tags, and pushes to origin.
#   6. Opens a *draft* GitHub Release with every artifact attached. Operator
#      reviews the body, edits if needed, clicks Publish. `gh release create`
#      is never run from CI.
#
# JOB ORDER (and why it is shaped this way)
#
#                  ┌─ image  ──────────────┐
#   tests → compute-version              ├─→ tag-publish → draft-release
#                  └─ binaries → provenance ┘
#
#   The deliberate split is `compute-version` (pure read) vs. `tag-publish`
#   (the only job that writes to origin), with all artifact production in
#   between. That makes failures non-destructive: nothing lands on master
#   until the artifacts are proven.
#
# FAILURE SEMANTICS
#   - tests / binaries / provenance fail   → master + tag list untouched.
#   - image fails after pushing to GHCR    → ghost vX.Y.Z image on GHCR;
#                                            re-run is idempotent (same digest
#                                            overwrites cleanly).
#   - tag-publish fails (e.g. master moved during the run)
#                                          → image already pushed; re-run only
#                                            tag-publish; image is reusable.
#   - draft-release fails                  → tag IS on origin; re-run draft-
#                                            release, or finish in the GitHub UI.
#
#   Use GitHub's "Re-run failed jobs" button on the workflow run page to
#   retry without bumping the version: succeeded-job outputs (including
#   compute-version's `next`) are preserved, only failed jobs re-execute.
#
# COSIGN VERIFICATION
#   Releases sign under workflow_dispatch on master, so the cosign keyless
#   certificate identity is the exact SAN
#     https://github.com/barbacana-waf/barbacana/.github/workflows/release.yml@refs/heads/master
#   The Makefile's `CERT_IDENTITY` is pinned to this string; `make verify`
#   uses --certificate-identity (exact match), no regex.
#
# SLSA PROVENANCE
#   The provenance file references the master HEAD commit (where the
#   binaries were built), not the bump commit (where the tag points).
#   Verify by digest:
#
#     slsa-verifier verify-artifact <archive> --provenance-path <file> \
#                                   --source-uri github.com/barbacana-waf/barbacana
#
#   Verifying with `--source-tag vX.Y.Z` will fail because of the
#   commit-vs-tag mismatch. Digest verification is sufficient and is what
#   downstream consumers should use.
#
# CHANGELOG NOTES
#   The draft body is auto-extracted from the matching `## [X.Y.Z]` section
#   of CHANGELOG.md (Keep-a-Changelog format, no `v` prefix in the heading).
#   If you forget to rename `## [Unreleased]` before dispatching, the body
#   falls back to a placeholder — fix it in the GitHub UI, no follow-up
#   commit needed.
#
# REQUIREMENTS
#   - RELEASE_TOKEN  : PAT with contents:write to bypass branch protection on
#                      master (https://github.com/settings/tokens).
#   - DOCKERHUB_USERNAME / DOCKERHUB_TOKEN : Docker Hub push credentials for
#                      the image-mirror step.

name: release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver field to bump"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: read

jobs:
  # Pre-flight gate: same job graph CI runs on every PR/master push. Nothing
  # below this line runs if the suite is red.
  tests:
    uses: ./.github/workflows/ci.yml

  # Compute the next version *without* writing it back to the repo. Every
  # downstream job uses this value via env vars / local-only tags. The
  # actual versions.mk bump + git tag push happens in tag-publish, after
  # all artifacts have been produced and signed.
  compute-version:
    needs: [tests]
    runs-on: ubuntu-24.04
    outputs:
      next: ${{ steps.next.outputs.next }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Compute next version (no side effects)
        id: next
        run: |
          set -euo pipefail
          CURRENT=$(grep -E '^BARBACANA_VERSION=' versions.mk | cut -d= -f2)
          STRIPPED=${CURRENT#v}
          IFS='.' read -r MAJOR MINOR PATCH <<<"${STRIPPED}"
          if ! [[ "${MAJOR}" =~ ^[0-9]+$ && "${MINOR}" =~ ^[0-9]+$ && "${PATCH}" =~ ^[0-9]+$ ]]; then
            echo "::error::BARBACANA_VERSION=${CURRENT} is not a valid vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          case "${{ inputs.bump }}" in
            major) MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0 ;;
            minor) MINOR=$((MINOR + 1)); PATCH=0 ;;
            patch) PATCH=$((PATCH + 1)) ;;
            *) echo "::error::unknown bump '${{ inputs.bump }}'" >&2; exit 1 ;;
          esac
          NEXT="v${MAJOR}.${MINOR}.${PATCH}"
          echo "next=${NEXT}" >> "$GITHUB_OUTPUT"
          echo "Bumping ${CURRENT} -> ${NEXT} (no push yet)"

  image:
    needs: [compute-version]
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      id-token: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - uses: ./.github/actions/load-versions
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: ko-build/setup-ko@d006021bd0c28d1ce33a07e7943d48b079944c8d # v0.9
        with:
          version: ${{ env.KO_VERSION }}
      - name: Log in to GitHub Packages
        run: echo "${{ secrets.GITHUB_TOKEN }}" | ko login ghcr.io --username "${{ github.actor }}" --password-stdin

      - name: Build and publish multi-arch image
        id: ko
        env:
          REPO: ghcr.io/barbacana-waf/barbacana
          VERSION: ${{ needs.compute-version.outputs.next }}
          COMMIT: ${{ github.sha }}
          KO_TAGS: ${{ needs.compute-version.outputs.next }}
          KO_PLATFORM: all
          KO_LOCAL: ""
          IMAGE_SOURCE: https://github.com/${{ github.repository }}
        # `latest` is intentionally NOT pushed by ko. It is applied below with
        # `crane tag` *after* cosign sign / attest so the canonical pull tag
        # sits at the top of the GHCR package page. cosign runs with
        # --new-bundle-format=false (see Makefile) so its artifacts land as
        # legacy `sha256-<digest>.sig` / `.att` tags, which GHCR filters out
        # of the "Recent tagged image versions" panel — without the flag,
        # cosign v3 pushes a Sigstore bundle whose fallback tag is a plain
        # `sha256-<digest>` (no suffix) that GHCR *does* surface, displacing
        # `latest` from the top.
        run: |
          set -euo pipefail
          make image-publish
          echo "image-ref=$(head -n1 image.refs)" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      - name: Sign image
        env:
          IMG: ${{ steps.ko.outputs.image-ref }}
        run: make sign IMG="${IMG}"

      - name: Generate CycloneDX SBOM
        env:
          VERSION: ${{ needs.compute-version.outputs.next }}
        run: make sbom

      - name: Attest SBOM to image
        env:
          IMG: ${{ steps.ko.outputs.image-ref }}
          VERSION: ${{ needs.compute-version.outputs.next }}
        run: make attest IMG="${IMG}"

      - name: Upload SBOM for the draft-release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: sbom-cyclonedx
          path: barbacana-*.cdx.json
          if-no-files-found: error

      # Apply `:latest` AFTER cosign sign / attest so it is the most recently
      # pushed tag on GHCR. `crane tag` is a metadata-only registry call:
      # same digest, no rebuild, no manifest change, so the existing keyless
      # signature still verifies for `:latest`.
      - name: Install crane
        uses: imjasonh/setup-crane@6da1ae018866400525525ce74ff892880c099987 # v0.5
        with:
          version: ${{ env.CRANE_VERSION }}

      - name: Tag :latest on GHCR
        env:
          IMG: ${{ steps.ko.outputs.image-ref }}
        run: crane tag "${IMG}" latest

      # Mirror to Docker Hub. ghcr.io is the canonical signed registry; the
      # mirror is image-only — cosign signatures and the SBOM attestation are
      # not mirrored. `cosign copy` preserves the image index manifest and
      # per-arch digests across registries.
      - name: Log in to Docker Hub
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Mirror image to Docker Hub
        env:
          SRC_REPO: ghcr.io/barbacana-waf/barbacana
          DST_REPO: docker.io/barbacana/barbacana
          VERSION: ${{ needs.compute-version.outputs.next }}
        run: |
          set -euo pipefail
          cosign copy --force "${SRC_REPO}:${VERSION}" "${DST_REPO}:${VERSION}"
          cosign copy --force "${SRC_REPO}:latest"     "${DST_REPO}:latest"

  binaries:
    needs: [compute-version]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
      - uses: ./.github/actions/load-versions
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: sigstore/cosign-installer@cad07c2e89fa2edd6e2d7bab4c1aa38e53f76003 # v4.1.1
        with:
          cosign-release: ${{ env.COSIGN_VERSION }}

      # Goreleaser derives {{ .Tag }} from `git describe`, which needs a tag
      # pointing at HEAD. Create one in the runner's local working tree only —
      # this tag is never pushed to origin. The real tag (pointing at the
      # bump commit) is created by tag-publish at the end of the workflow,
      # after every artifact-producing job has succeeded.
      - name: Create local-only tag for goreleaser
        env:
          NEXT: ${{ needs.compute-version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git tag -a "${NEXT}" -m "${NEXT}"

      - uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Surface CRS_VERSION to GoReleaser's ldflags template.
          CRS_VERSION: ${{ env.CRS_VERSION }}

      # SLSA generic generator subject list: sha256 of every release archive,
      # base64-encoded. The provenance job below attests these hashes.
      - name: Compute artifact hashes for SLSA provenance
        id: hash
        run: |
          set -euo pipefail
          cd dist
          hashes=$(sha256sum *.tar.gz *.zip | base64 -w0)
          echo "hashes=${hashes}" >> "$GITHUB_OUTPUT"

      - name: Upload binary bundle for the draft-release job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binary-bundle
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/checksums.txt
            dist/checksums.txt.bundle
          if-no-files-found: error

  # SLSA3 build provenance over the binary archives. The reusable workflow
  # signs `barbacana.intoto.jsonl` via Sigstore using GitHub OIDC and uploads
  # it as the workflow artifact named in `provenance-name`.
  provenance:
    needs: [binaries]
    permissions:
      actions: read
      id-token: write
      contents: write
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: ${{ needs.binaries.outputs.hashes }}
      provenance-name: barbacana.intoto.jsonl
      upload-assets: false

  # The point-of-no-return. Runs only after every artifact-producing job
  # has succeeded — failure here is the only path that leaves a stranded
  # ghost image on the registry, and that's recoverable by re-running the
  # job (image push and `crane tag latest` are both idempotent).
  tag-publish:
    needs: [compute-version, image, binaries, provenance]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      next: ${{ needs.compute-version.outputs.next }}
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Update versions.mk
        env:
          NEXT: ${{ needs.compute-version.outputs.next }}
        run: |
          set -euo pipefail
          sed -i "s/^BARBACANA_VERSION=.*/BARBACANA_VERSION=${NEXT}/" versions.mk
          grep -E '^BARBACANA_VERSION=' versions.mk

      - name: Commit, tag, and push
        env:
          NEXT: ${{ needs.compute-version.outputs.next }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${{ secrets.RELEASE_TOKEN }}@github.com/barbacana-waf/barbacana.git
          git add versions.mk
          git commit -m "release: ${NEXT}"
          git tag -a "${NEXT}" -m "${NEXT}"
          git push origin HEAD
          git push origin "${NEXT}"

  draft-release:
    needs: [tag-publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450 # v2.19.1
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.tag-publish.outputs.next }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binary-bundle
          path: assets/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: sbom-cyclonedx
          path: assets/
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: barbacana.intoto.jsonl
          path: assets/

      # Pull the matching `## [X.Y.Z]` section from CHANGELOG.md as the
      # initial draft body. The CHANGELOG uses Keep-a-Changelog format with
      # version headings *without* a leading `v`, so strip it here. If the
      # section is missing, fall back to a placeholder so the draft is still
      # created and the operator can fill it in.
      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          NEXT: ${{ needs.tag-publish.outputs.next }}
        run: |
          set -euo pipefail
          version="${NEXT#v}"
          notes=$(awk -v v="${version}" '
            $0 ~ "^## \\[" v "\\]" { capture=1; next }
            capture && /^## \[/  { exit }
            capture                { print }
          ' CHANGELOG.md)
          if [ -z "$(echo "${notes}" | tr -d '[:space:]')" ]; then
            notes="_No CHANGELOG entry found for ${NEXT}. Edit before publishing._"
          fi
          {
            echo "body<<__EOF__"
            echo "${notes}"
            echo "__EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          tag_name: ${{ needs.tag-publish.outputs.next }}
          name: ${{ needs.tag-publish.outputs.next }}
          body: ${{ steps.notes.outputs.body }}
          draft: true
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            assets/*.tar.gz
            assets/*.zip
            assets/checksums.txt
            assets/checksums.txt.bundle
            assets/barbacana-*.cdx.json
            assets/barbacana.intoto.jsonl
