name: weekly-fuzz

# Coverage-guided fuzzing of parser/decoder targets. The seed corpus runs
# inside the regular `test` job in ci.yml on every push; this workflow is
# the long-running burst that explores beyond the seeds. Cadence is
# weekly (not nightly) because the matrix is small and the targets sit on
# stable code — see docs/design/testing.md.
#
# Findings: any crash file the fuzzer minimizes lands in
# testdata/fuzz/<FuzzFn>/<hex-id>. Triage workflow:
#   1. Download the artifact attached to the failed run.
#   2. Commit the seed under the package's testdata/fuzz/<FuzzFn>/ dir.
#   3. Reproduce locally with `go test -run=<FuzzFn>/<hex-id> ./<pkg>`.
#   4. Add the case to the unit test table, fix, push.
on:
  schedule:
    # Fridays 06:00 UTC — aligned with the daily security-scan workflow
    - cron: "0 6 * * 5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-24.04
    strategy:
      # Don't cancel siblings if one target crashes — we want every
      # target's corpus delta uploaded for triage.
      fail-fast: false
      matrix:
        include:
          - pkg: ./internal/protections/base64decode
            fn: FuzzTryDecode
            corpus: internal/protections/base64decode/testdata/fuzz/FuzzTryDecode
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ./.github/actions/load-versions
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Fuzz ${{ matrix.fn }}
        run: go test -run='^$' -fuzz=${{ matrix.fn }} -fuzztime=30m ${{ matrix.pkg }}

      - name: Upload corpus delta on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-corpus-${{ matrix.fn }}
          path: ${{ matrix.corpus }}/
          if-no-files-found: ignore
