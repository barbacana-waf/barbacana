version: v1alpha1
port: 18080

global:
  mode: blocking

routes:
  - upstream: http://localhost:19000
    disable:
      - response-headers-add-hsts
      - response-headers-add-frame-options
    enable:
      - response-headers-add-csp
      - response-headers-add-coop
      - response-headers-add-permissions-policy
